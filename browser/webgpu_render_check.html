<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SWBF2 Phase 2 Real Engine WebGPU Renderer Check</title>
  <style>
    body { background: #111; color: #ddd; font-family: monospace; margin: 16px; }
    canvas { border: 1px solid #444; display: block; margin-bottom: 12px; }
    pre { white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="gpu-canvas" width="640" height="360"></canvas>
  <pre id="out">Running Phase 2 Real Engine WebGPU Renderer check...</pre>
  <script type="module">
    const out = document.getElementById('out');
    const canvas = document.getElementById('gpu-canvas');

    function rgbaToPngDataUrl(buf, w, h) {
      if (!buf) return null;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const img = new ImageData(new Uint8ClampedArray(buf), w, h);
      ctx.putImageData(img, 0, 0);
      return c.toDataURL('image/png');
    }

    async function run() {
      try {
        const offscreen = canvas.transferControlToOffscreen();
        const worker = new Worker('/browser/worker.mjs', { type: 'module' });
        const result = await new Promise((resolve, reject) => {
          worker.onerror = (e) => reject(new Error(e.message || 'worker error'));
          worker.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'log') {
              console.log(ev.data.text);
              return;
            }
            resolve(ev.data);
          };
          worker.postMessage(
            { id: 1, cmd: 'runPhase2RenderCheck', opts: { canvas: offscreen, width: 640, height: 360, closeHandlesOnExit: true } },
            [offscreen]
          );
        });
        worker.terminate();

        window.__phase2PngA = rgbaToPngDataUrl(result.pixelsA, result.width, result.height);
        window.__phase2PngB = rgbaToPngDataUrl(result.pixelsB, result.width, result.height);
        delete result.pixelsA;
        delete result.pixelsB;
        result.crossOriginIsolated = self.crossOriginIsolated;
        window.__phase2Result = result;
        out.textContent = JSON.stringify(result, null, 2);
      } catch (err) {
        const r = { ok: false, error: String(err && err.stack ? err.stack : err) };
        window.__phase2Result = r;
        out.textContent = JSON.stringify(r, null, 2);
      }
    }
    run();
  </script>
</body>
</html>
